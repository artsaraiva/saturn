[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saturn"
version = "0.1.0"
description = "Saturn CLI-first prototype"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "mcp"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx", "pytest-asyncio"]

[project.scripts]
saturn = "saturn.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
